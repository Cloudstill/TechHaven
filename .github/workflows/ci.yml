name: CI Build Check

on:
  push:
    branches: ["master", "review/frontend-fixes", "feature/agent-ui"]
  pull_request:
    branches: ["master", "review/frontend-fixes"]

jobs:
  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vitest4 + jsdom30 需要 Node >=22.12（undici/webidl.markAsUncloneable），
          # 与根 package.json engines 对齐
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check & build site
        run: npm run build

      - name: Run frontend unit tests
        run: npm test

      - name: Check bundle size budget
        run: node scripts/check-bundle-size.mjs

      - name: Check build artifacts
        run: |
          test -d ./dist
          test "$(ls -A ./dist)"
